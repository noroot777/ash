  <header class="page-head">
    <a class="wordmark" href="index.html">ash<span>/</span><span>交互实验室</span></a>
    <span class="page-tag">HTML DEMO · 不连接真实任务</span>
  </header>

  <main class="page">
    <section class="intro">
      <h1>等你拍板的事，落在你说话的地方。</h1>
      <p>提问、裁定、派审查、确认现在各有一张卡或一个弹窗。方案里它们回到回复框和被点的那颗键上；两方辩论本来就是对话，放回会话的左右两边；ash 的提示条缩成所属那颗键上的状态。</p>
    </section>

    <section class="controls" aria-label="演示开关">
      <div class="control"><span>场面</span><div class="seg" data-key="scene">
        <button type="button" data-value="ask">它问你</button><button type="button" data-value="rule">等你裁定</button><button type="button" data-value="review">派审查</button><button type="button" data-value="confirm">确认</button><button type="button" data-value="notice">提示条</button>
      </div></div>
      <div class="control"><span>画法</span><div class="seg" data-key="style">
        <button type="button" data-value="old">现在</button><button type="button" data-value="new">方案</button>
      </div></div>
      <div class="control" data-for="ask"><span>问题</span><div class="seg" data-key="askKind">
        <button type="button" data-value="one">一个</button><button type="button" data-value="many">三个</button>
      </div></div>
      <div class="control" data-for="rule"><span>时刻</span><div class="seg" data-key="moment">
        <button type="button" data-value="open">刚驳回</button><button type="button" data-value="debating">辩论中</button><button type="button" data-value="debated">辩完了</button>
      </div></div>
      <div class="control" data-for="notice"><span>哪一条</span><div class="seg" data-key="notice">
        <button type="button" data-value="plan">计划模式</button><button type="button" data-value="ctx">没开 1M</button><button type="button" data-value="queue">排着的输入</button><button type="button" data-value="moved">已接力走</button>
      </div></div>
      <button type="button" class="play" id="reset"><svg class="icon"><use href="#i-redo"/></svg>重来</button>
    </section>

    <section class="stage" id="stage"></section>

    <section class="moves" id="moves"></section>

    <section class="moves" id="census"></section>
  </main>

  <script src="data.js"></script>
  <script src="parts.js"></script>
  <script src="dock.js"></script>
  <script src="scenes.js"></script>
  <script src="census.js"></script>
  <script src="app.js"></script>
</body>
</html>
