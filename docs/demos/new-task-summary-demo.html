<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新建任务 · 执行摘要条方案</title>
<link rel="stylesheet" href="./new-task-summary-demo.css">
</head>
<body>

<svg class="icon-sprite" aria-hidden="true">
  <symbol id="i-robot" viewBox="0 0 16 16"><rect x="2.5" y="4.5" width="11" height="8" rx="2.5"/><path d="M8 2v2.5M5.5 8.5h.01M10.5 8.5h.01"/></symbol>
  <symbol id="i-users" viewBox="0 0 16 16"><circle cx="6" cy="5.5" r="2.2"/><path d="M2.4 13c.5-2.2 1.9-3.3 3.6-3.3S9.1 10.8 9.6 13M10.6 3.6a2.2 2.2 0 0 1 0 4.3M11.4 9.9c1.3.3 2.1 1.4 2.4 3.1"/></symbol>
  <symbol id="i-chat" viewBox="0 0 16 16"><path d="M13.5 9.2c0 .9-.7 1.6-1.6 1.6H6.4L3 13.3V4.8c0-.9.7-1.6 1.6-1.6h7.3c.9 0 1.6.7 1.6 1.6z"/></symbol>
  <symbol id="i-flow" viewBox="0 0 16 16"><path d="M2.6 4.5h10.8M2.6 8h10.8M2.6 11.5h10.8"/><circle cx="6" cy="4.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="10.5" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="11.5" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-branch" viewBox="0 0 16 16"><circle cx="4.5" cy="3.6" r="1.7"/><circle cx="4.5" cy="12.4" r="1.7"/><circle cx="11.5" cy="6.2" r="1.7"/><path d="M4.5 5.3v5.4M4.5 8.6h3.3c2 0 3.7-.8 3.7-2.4"/></symbol>
  <symbol id="i-stack" viewBox="0 0 16 16"><path d="M8 2.2 14 5.3 8 8.4 2 5.3zM2 8.7l6 3.1 6-3.1"/></symbol>
  <symbol id="i-tag" viewBox="0 0 16 16"><path d="M8.3 2.3H13v4.7l-5.9 5.9a1.3 1.3 0 0 1-1.9 0L2.4 10a1.3 1.3 0 0 1 0-1.9z"/><path d="M10.6 5h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.4 8.4 6.5 11.5l6.1-7"/></symbol>
  <symbol id="i-clip" viewBox="0 0 16 16"><path d="M12.4 7.3 7.9 11.8a2.7 2.7 0 0 1-3.8-3.8l5-5a1.8 1.8 0 0 1 2.5 2.5l-4.9 5a.9.9 0 0 1-1.3-1.3l4.4-4.4"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5.4 3.6 12 8l-6.6 4.4z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-caret" viewBox="0 0 16 16"><path d="M4.6 6.4 8 9.8l3.4-3.4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 4.9V8l2.1 1.6"/></symbol>
</svg>

<div class="app">
  <main class="task-composer-panel">

    <header class="composer-header">
      <span class="workspace-kind-chip">新建</span>
      <b>新建任务</b>
      <span class="composer-project">harness</span>

      <div class="composer-modes" role="tablist" aria-label="任务模式">
        <button type="button" role="tab" data-mode="single" aria-selected="true">
          <svg class="ic"><use href="#i-robot"/></svg>单任务
        </button>
        <button type="button" role="tab" data-mode="team" aria-selected="false">
          <svg class="ic"><use href="#i-users"/></svg>团队
        </button>
        <button type="button" role="tab" data-mode="duet" aria-selected="false">
          <svg class="ic"><use href="#i-chat"/></svg>讨论
        </button>
      </div>

      <button type="button" class="ui-button is-ghost">取消 Esc</button>
    </header>

    <div class="composer-scroll">
      <div class="composer-inner">

        <section class="objective" aria-label="任务描述">
          <textarea id="body" rows="1" autofocus
            placeholder="描述要做什么…"></textarea>
          <div class="objective-bar">
            <button type="button" class="objective-icon" id="attach" aria-label="添加附件">
              <svg class="ic"><use href="#i-clip"/></svg>
            </button>
            <span class="objective-hint">
              输入 <code>/</code> 调用技能，<code>/team</code> <code>/duet</code> 切换模式
            </span>
            <span class="objective-count" id="count">0 字</span>
          </div>
        </section>

        <div class="attachments" id="attachments" hidden></div>

        <section class="summary" aria-label="执行配置">
          <div class="summary-chips" id="chips"></div>
          <p class="summary-note" id="note"></p>
        </section>

      </div>
    </div>

    <footer class="composer-footer">
      <div class="footer-left">
        <svg class="ic"><use href="#i-clip"/></svg>
        <span id="footerHint">0 个附件 · ⌘↵ 按当前启动方式创建</span>
      </div>
      <div class="launch-control">
        <button type="button" class="launch-mode" id="launchMode">
          <svg class="ic"><use href="#i-play"/></svg>
          <span id="launchModeLabel">创建并运行</span>
          <svg class="ic is-caret"><use href="#i-caret"/></svg>
        </button>
        <button type="button" class="launch-submit" id="submit" disabled>
          <svg class="ic"><use href="#i-play"/></svg><span id="submitLabel">创建并运行</span>
        </button>
      </div>
    </footer>

  </main>
</div>

<div class="popover" id="popover" role="dialog" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="./new-task-summary-demo.js"></script>
</body>
</html>
