<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统提示局部改版 Demo</title>
  <link rel="stylesheet" href="system-notice-task-demo.css">
</head>
<body>
  <main class="task-detail">
    <header class="task-header">
      <span class="task-kind">自由任务</span>
      <b>执行过程折叠时机</b>
      <span class="task-status"><i></i>正在审查</span>
      <button type="button">查看改动</button>
    </header>

    <section class="task-conversation">
      <div id="conversationRows"></div>

      <div class="run-activity"><span class="run-activity-signal"><i></i><i></i><i></i></span><b>智能体委派中</b><span>新一轮审查正在验证最终折叠时机。</span></div>

      <div class="reply-box">给智能体追加消息…<div><span>@ claude@ccb</span><button type="button" aria-label="发送">↑</button></div></div>
    </section>
  </main>
  <script src="system-notice-task-demo.data.js"></script>
  <script src="system-notice-task-demo.js"></script>
</body>
</html>
