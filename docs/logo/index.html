<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ash · logo</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        background: #f4f4f5;
        color: #111113;
        font: 400 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      }
      main { max-width: 1120px; margin: 0 auto; padding: 56px 32px 96px; display: grid; gap: 56px; }
      section { display: grid; grid-template-columns: 240px 1fr; gap: 20px 40px; align-items: start; }
      h2 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
      p { margin: 0; color: #5c5c63; }
      img { display: block; }
      .icon { grid-row: span 2; }
      .icon > img { width: 240px; height: 240px; filter: drop-shadow(0 8px 20px rgb(0 0 0 / 0.16)); }
      .ladder { display: flex; align-items: flex-end; gap: 20px; margin-top: 24px; }
      /* 透明底的几份跟着所在色块的 color-scheme 换色，同一份文件在左右两块里各是一套。 */
      .pair { display: grid; grid-template-columns: 1fr 1fr; border-radius: 14px; overflow: hidden; align-self: end; }
      .pair > div { display: flex; align-items: center; gap: 32px; padding: 28px 32px; min-width: 0; }
      .pair > div:first-child { color-scheme: light; background: #fff; }
      .pair > div:last-child { color-scheme: dark; background: #151518; }
      .still img { height: 72px; min-width: 0; }
      .still img:first-child { height: 96px; }
      .motion { grid-column: 1 / -1; }
      .motion > div { align-items: flex-end; }
      .reel { grid-column: 1 / -1; padding: 24px 32px; border-radius: 14px; background: #fff; }
      .reel img { width: 100%; height: auto; }
      @media (max-width: 860px) {
        section { grid-template-columns: 1fr; }
        .pair { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="icon">
          <img src="icon.svg" alt="ash" />
          <div class="ladder">
            <img src="icon.svg" width="64" alt="" /><img src="favicon.svg" width="32" alt="" /><img src="favicon.svg" width="16" alt="" />
          </div>
        </div>
        <div>
          <h2>标</h2>
          <p>一整块从一角散成点，最远那一点还亮着。</p>
        </div>
        <div class="pair still">
          <div><img src="mark.svg" alt="" /><img src="lockup.svg" alt="" /></div>
          <div><img src="mark.svg" alt="" /><img src="lockup.svg" alt="" /></div>
        </div>
      </section>

      <section>
        <div class="motion">
          <h2>加载动画</h2>
          <p>身子不动，右上那一撮像尾巴一样左右甩，尾巴尖比尾巴根晚一点到。</p>
        </div>
        <div class="pair motion">
          <div>
            <img src="loader.svg" width="160" alt="" /><img src="loader.svg" width="80" alt="" /><img src="loader.svg" width="40" alt="" /><img src="loader.svg" width="30" alt="" /><img src="loader.svg" width="20" alt="" />
          </div>
          <div>
            <img src="loader.svg" width="160" alt="" /><img src="loader.svg" width="80" alt="" /><img src="loader.svg" width="40" alt="" /><img src="loader.svg" width="30" alt="" /><img src="loader.svg" width="20" alt="" />
          </div>
        </div>
        <div class="reel"><img src="frames.svg" alt="一个来回的八张定格" /></div>
      </section>
    </main>
  </body>
</html>
