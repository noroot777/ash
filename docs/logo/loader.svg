<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 10 10" width="320" height="320" shape-rendering="crispEdges">
<style>svg{--ink:#111113;--live:#5e6ad2}@media (prefers-color-scheme:dark){svg{--ink:#f1f0ec;--live:#8b95ee}}</style><style>.tail{animation:wag 420ms ease-in-out infinite alternate}@keyframes wag{from{transform:translate(calc(var(--dx)*-1px),calc(var(--dy)*-1px))}to{transform:translate(calc(var(--dx)*1px),calc(var(--dy)*1px))}}</style><rect x="2" y="2" width="1" height="1" style="fill:var(--ink)"/><rect x="0" y="3" width="1" height="1" style="fill:var(--ink)"/><rect x="3" y="3" width="1" height="1" style="fill:var(--ink)"/><rect x="0" y="4" width="3" height="1" style="fill:var(--ink)"/><rect x="4" y="4" width="1" height="1" style="fill:var(--ink)"/><rect x="0" y="5" width="4" height="1" style="fill:var(--ink)"/><rect x="6" y="5" width="1" height="1" style="fill:var(--ink)"/><rect x="0" y="6" width="5" height="1" style="fill:var(--ink)"/><rect x="0" y="7" width="5" height="1" style="fill:var(--ink)"/><rect x="6" y="7" width="1" height="1" style="fill:var(--ink)"/><rect class="tail" x="7" y="0" width="1" height="1" style="fill:var(--live);--dx:0.95;--dy:0.95;animation-delay:-107ms"/><rect class="tail" x="4" y="1" width="1" height="1" style="fill:var(--ink);--dx:0.74;--dy:0.32;animation-delay:-183ms"/><rect class="tail" x="6" y="2" width="1" height="1" style="fill:var(--ink);--dx:0.53;--dy:0.74;animation-delay:-168ms"/><rect class="tail" x="5" y="3" width="1" height="1" style="fill:var(--ink);--dx:0.32;--dy:0.53;animation-delay:-210ms"/>
</svg>
