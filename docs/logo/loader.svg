<svg xmlns="http://www.w3.org/2000/svg" class="ash-loader" viewBox="0 0 8 8" width="256" height="256" shape-rendering="crispEdges">
<style>svg{--ink:#111113;--live:#5e6ad2}@media (prefers-color-scheme:dark){svg{--ink:#f1f0ec;--live:#8b95ee}}</style><style>svg{color:var(--ink);--accent:var(--live)}.ash-loader { --ash-loader-tick: 60ms; flex: none; display: inline-block; vertical-align: -0.2em; } .ash-loader__tip { fill: var(--accent); } .ash-loader__line { fill: currentColor; animation: ash-loader-burn calc(25 * var(--ash-loader-tick)) step-end infinite; animation-delay: calc(var(--step) * var(--ash-loader-tick)); } @keyframes ash-loader-burn { 0% { fill: var(--accent); opacity: 1; } 4% { fill: currentColor; opacity: 0.25; } 8% { fill: currentColor; opacity: 0.6; } 12%, 100% { fill: currentColor; opacity: 1; } }</style><g class="ash-loader__line" style="--step:0"><rect x="0" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:1"><rect x="0" y="6" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:2"><rect x="0" y="5" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:3"><rect x="0" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:4"><rect x="0" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:5"><rect x="2" y="4" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/></g><g class="ash-loader__line" style="--step:6"><rect x="6" y="7" width="1" height="1"/></g><g class="ash-loader__line" style="--step:7"><rect x="2" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="4" width="1" height="1"/></g><g class="ash-loader__line" style="--step:8"><rect x="6" y="5" width="1" height="1"/></g><g class="ash-loader__line" style="--step:9"><rect x="5" y="3" width="1" height="1"/></g><g class="ash-loader__line" style="--step:10"><rect x="4" y="1" width="1" height="1"/></g><g class="ash-loader__line" style="--step:11"><rect x="6" y="2" width="1" height="1"/></g><rect class="ash-loader__tip" x="7" y="0" width="1" height="1"/>
</svg>
