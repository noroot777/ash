<svg xmlns="http://www.w3.org/2000/svg" class="navi-mark navi-loader" viewBox="0 0 24 24" width="256" height="256">
<style>svg{--ink:#111113;--north:#e5484d}@media (prefers-color-scheme:dark){svg{--ink:#f1f0ec;--north:#ff6b6b}}</style><style>:root{--navi-ink:#111113;--navi-north:#e5484d}:root[data-theme="dark"]{--navi-ink:#f1f0ec;--navi-north:#ff6b6b}.navi-tile{background:#eceae4;--navi-ink:#111113;--navi-north:#e5484d}.navi-inverse{--navi-ink:#f1f0ec;--navi-north:#ff6b6b}:root[data-theme="dark"] .navi-inverse{--navi-ink:#111113;--navi-north:#e5484d}.navi-mark__needle{transform-box:view-box;transform-origin:12px 12px}.navi-mark { flex: none; display: inline-block; vertical-align: -0.2em; fill: var(--navi-ink); } .navi-mark__north { fill: var(--navi-north); } .navi-loader .navi-mark__needle { animation: navi-seek 1800ms cubic-bezier(0.45, 0, 0.55, 1) infinite; } @keyframes navi-seek { 0% { transform: rotate(0deg); } 20% { transform: rotate(37.29deg); } 40% { transform: rotate(-2.6deg); } 56% { transform: rotate(14.9deg); } 69% { transform: rotate(-1.5deg); } 80%, 100% { transform: rotate(0deg); } } svg.navi-loader{--navi-ink:var(--ink);--navi-north:var(--north)}</style><g class="navi-mark__needle"><polygon points="12,20.4 9.48,12 14.52,12" /><polygon points="12,3.6 14.52,12 9.48,12" class="navi-mark__north"/></g><polygon points="7.92,3 11.32,3 4.77,21 1.37,21" /><polygon points="19.23,3 22.63,3 16.08,21 12.68,21" />
</svg>
