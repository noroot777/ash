<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>设置 · 分组 — Harness UI 讨论稿 v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="settings-shell">
    <div data-include="settings-side" data-active="groups"></div>
    <main class="set-main">
      <div class="set-inner">
        <h1 class="set-title">分组</h1>
        <p class="set-sub">harness · 批次容器与串并行运行方式</p>

        <h3 class="sect-title">全部分组</h3>
        <div class="sect-card">
          <div class="group-row selectable selected"><span class="gt"><b>前端体验</b><small>3 个任务 · 1 运行中 · 队列推进中</small></span><span class="mode-tag">serial</span><button class="ui-btn">运行</button></div>
          <div class="group-row selectable"><span class="gt"><b>每日流水线</b><small>4 个任务 · 全部完成 · 昨天 23:40</small></span><span class="mode-tag">serial</span><button class="ui-btn">运行</button></div>
          <div class="group-row selectable"><span class="gt"><b>方案评审</b><small>2 个任务 · 并行执行</small></span><span class="mode-tag">parallel</span><button class="ui-btn">运行</button></div>
        </div>

        <h3 class="sect-title">新建分组</h3>
        <div class="sect-card">
          <div class="setting-row"><div class="setting-copy"><b>分组名</b><small>显示在任务筛选与运行命令中</small></div><div class="setting-control"><input class="form-input" placeholder="移动端收尾"></div></div>
          <div class="setting-row"><div class="setting-copy"><b>运行模式</b><small>serial 按队列推进；parallel 同时拉起</small></div><div class="setting-control"><div class="fake-select">serial<span class="fs-caret">▾</span></div></div></div>
          <div class="sc-foot"><span class="hint">新建后可在任务详情里把任务移入分组</span><button class="ui-btn primary">新建分组</button></div>
        </div>
        <p class="settings-note">日常“运行整组”仍可从任务树与 ⌘K 触发，本页用于全量管理。</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
