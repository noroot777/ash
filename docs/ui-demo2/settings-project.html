<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>设置 · 项目 — Ash UI 讨论稿 v2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="settings-shell">
    <div data-include="settings-side" data-active="project"></div>
    <main class="set-main">
      <div class="set-inner">
        <h1 class="set-title">项目设置</h1>
        <p class="set-sub">ash · <span class="mono">~/code/ash</span></p>

        <h3 class="sect-title">基本信息</h3>
        <div class="sect-card">
          <div class="setting-row"><div class="setting-copy"><b>项目名称</b><small>显示在项目切换器与任务树顶部</small></div><div class="setting-control"><input class="form-input" value="ash"></div></div>
          <div class="setting-row"><div class="setting-copy"><b>仓库路径</b><small>任务、分组与 worktree 的项目根目录</small></div><div class="setting-control"><input class="form-input mono" value="~/code/ash"></div></div>
        </div>

        <h3 class="sect-title">运行默认</h3>
        <div class="sect-card">
          <div class="setting-row"><div class="setting-copy"><b>独立 worktree</b><small>新任务默认在项目外的隔离工作树中运行</small></div><div class="setting-control"><span class="tgl"></span></div></div>
          <div class="setting-row"><div class="setting-copy"><b>默认基线</b><small>未显式指定 worktreeBase 时使用</small></div><div class="setting-control"><div class="fake-select mono">项目当前分支<span class="fs-caret">▾</span></div></div></div>
          <div class="setting-row"><div class="setting-copy"><b>默认执行器</b><small>仅选择 Profile，模型与强度跟随它</small></div><div class="setting-control"><div class="fake-select"><span class="mini-avatar">C</span>claude@ccb<span class="fs-caret">▾</span></div></div></div>
        </div>

        <h3 class="sect-title">危险区</h3>
        <div class="sect-card">
          <div class="setting-row"><div class="setting-copy"><b style="color:var(--red)">移除项目</b><small>只从 ash 移除，不改磁盘上的仓库、分支或 worktree</small></div><div class="setting-control"><button class="ui-btn danger">移除项目…</button></div></div>
        </div>
        <p class="settings-note">控件固定靠右，左侧只负责标题与解释；分节之间靠留白区分，不叠加多余装饰。</p>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
