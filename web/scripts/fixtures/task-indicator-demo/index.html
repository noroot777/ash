<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待验收圆点 · 五种样式对照</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --page: #fafafa; --surface: #fff; --panel: #f1f1f3;
      --ink: #292c32; --muted: #69707b; --line: #dfe1e6;
      --hover: #e8e9ed; --selected: #e1e3eb;
      --accent: #686fcb; --dot-ink: #858aa8; --queue: #b4b7c1;
      --red: #b65e64; --amber: #997128;
      color: var(--ink); background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root.dark {
      color-scheme: dark;
      --page: #191a1e; --surface: #26272d; --panel: #222328;
      --ink: #e1e3eb; --muted: #a3a7b3; --line: #3b3d46;
      --hover: #30323c; --selected: #3a3e4c;
      --accent: #a1a7f5; --dot-ink: #a0a6c5; --queue: #6c7180;
      --red: #e4979b; --amber: #d5b477;
    }
    body { margin: 0; padding: 38px 24px; }
    main { max-width: 1140px; margin: auto; }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .eyebrow { color: var(--muted); font-size: 11px; letter-spacing: 1.6px; }
    h1 { margin: 12px 0; font-size: 28px; font-weight: 600; letter-spacing: -.8px; }
    .intro { margin: 0; font-size: 13px; line-height: 1.9; color: var(--muted); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 23px 0 12px; }
    .control { padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 12px; }
    .control:hover { background: var(--hover); }
    .control[aria-pressed="true"] { background: var(--selected); }
    .toolbar-spacer { flex: 1; }
    .feedback { min-height: 22px; margin: 0 0 17px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .gallery.single { grid-template-columns: minmax(0, 360px); justify-content: center; }
    .card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 15px 7px; }
    .card h2 { margin: 0; font-size: 13px; font-weight: 600; }
    .number { margin-right: 8px; color: var(--muted); font-size: 10px; font-weight: 400; }
    .isolate { padding: 4px; border: 0; background: none; color: var(--muted); font-size: 11px; }
    .isolate:hover { color: var(--ink); text-decoration: underline; }
    .description { min-height: 34px; margin: 0; padding: 0 15px; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .specimens { display: flex; gap: 25px; align-items: center; padding: 10px 15px 14px; }
    .specimen { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; }
    .sample-stage { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 6px; background: var(--panel); }
    .zoom .dot { transform: scale(4); }
    .list { padding: 9px 7px; background: var(--panel); border-top: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 6px; width: 100%; height: 32px; padding: 0 7px; border: 0; border-radius: 6px; background: none; text-align: left; }
    .row:hover { background: var(--hover); }
    .row.selected { background: var(--selected); }
    .leading { display: grid; place-items: center; flex: 0 0 22px; }
    .task-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 400; }
    .status { flex-shrink: 0; color: var(--muted); font-size: 10px; }
    .dot { display: block; position: relative; width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; flex-shrink: 0; }
    .style-original .dot {
      background: color-mix(in oklab, var(--accent) 16%, transparent);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }
    .style-hairline .dot { width: 6px; height: 6px; border: 1px solid color-mix(in srgb, var(--dot-ink) 85%, transparent); }
    .style-micro .dot { width: 4px; height: 4px; background: var(--dot-ink); }
    .style-matte .dot { width: 6px; height: 6px; background: color-mix(in srgb, var(--dot-ink) 55%, transparent); }
    .style-soft-core .dot { background: color-mix(in srgb, var(--dot-ink) 16%, transparent); }
    .style-soft-core .dot::after {
      content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%;
      left: 2px; top: 2px; background: var(--dot-ink);
    }
    .style-small-ring .dot { width: 5px; height: 5px; border: 1px solid color-mix(in srgb, var(--accent) 75%, transparent); }
    .signal { display: block; width: 6px; height: 6px; border-radius: 50%; }
    .signal.running { background: var(--accent); }
    .signal.failed { background: var(--red); }
    .signal.question { background: var(--amber); }
    .signal.queued { background: transparent; box-shadow: inset 0 0 0 1px var(--queue); }
    .spec { padding: 10px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .notes { margin: 20px 0 0; color: var(--muted); font-size: 12px; line-height: 1.9; }
    .notes a { color: inherit; text-underline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 980px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      body { padding: 25px 15px; }
      h1 { font-size: 25px; }
      .gallery { grid-template-columns: minmax(0, 1fr); max-width: 400px; margin: auto; }
      .toolbar-spacer { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">NAVI / 只换小圆点</div>
    <h1>不改含义，只让它轻一点。</h1>
    <p class="intro">原样 + 五种候选。全部保持在行首、静态常驻，点开任务也不会消失。只有待验收圆点变，标题与其他状态不变。<a href="status-palette.html">查看现有状态的真实颜色与动效对照 →</a></p>
    <div class="toolbar">
      <button class="control" type="button" id="all">全部对比</button>
      <button class="control" type="button" id="density" aria-pressed="false">看更密的列表</button>
      <button class="control" type="button" id="mixed" aria-pressed="false">混合其他状态</button>
      <button class="control" type="button" id="clear">清除选中</button>
      <span class="toolbar-spacer"></span>
      <button class="control" type="button" id="theme" aria-pressed="false">深色</button>
    </div>
    <p class="feedback" id="feedback" role="status">先看列表里的真实尺寸，再看 4× 放大。可以点击同一行，比较选中背景上的效果。</p>
    <div class="gallery" id="gallery"></div>
    <p class="notes">混合状态模式包含运行、等答复、失败、排队和已验收，方便检查是否混淆。微实心更省视觉空间，但也更接近运行实心点。<br>仅为独立样式 demo，不修改正式界面或真实任务。<a href="acceptance-states.html">上一轮状态方案</a></p>
  </main>
  <script>
    const styles = [
      { key: "original", number: "原样", name: "当前圆环", description: "对照基准：靛蓝色、粗环，内部有浅填色。", spec: "7 px · 1.5 px 环线 · 原有主色" },
      { key: "hairline", number: "01", name: "细线环", description: "去掉内填色，环线更细，颜色改成低饱和蓝灰。", spec: "6 px · 1 px 环线 · 蓝灰" },
      { key: "micro", number: "02", name: "微实心", description: "缩成一个针尖大小的实心点，不再有靶心感。", spec: "4 px · 无边框 · 蓝灰" },
      { key: "matte", number: "03", name: "雾面点", description: "保持圆点的可见面积，拿掉硬边，用浅实心表达。", spec: "6 px · 55% 蓝灰填色 · 无边框" },
      { key: "soft-core", number: "04", name: "柔芯点", description: "中间一粒小点，外面一圈淡色底，不画硬圆环。", spec: "7 px 浅底 · 3 px 点芯 · 无模糊与发光" },
      { key: "small-ring", number: "05", name: "迷你空心环", description: "保留熟悉的空心含义，但整体缩小、主色减淡。", spec: "5 px · 1 px 环线 · 75% 原有主色" }
    ];
    const titles = [
      "排查 GitHub 登录回调", "调整任务详情的留白", "修复侧栏滚动位置",
      "优化长任务标题截断", "统一设置页按钮尺寸", "整理验收结果提示",
      "修复附件预览层级", "调整项目切换交互", "优化终端连接提示",
      "补齐空列表占位", "修复任务搜索焦点", "调整消息时间显示"
    ];
    const statusLabels = { pending: "已完成，待验收", running: "运行中", question: "等你答复", failed: "失败", queued: "排队中", accepted: "已验收" };
    let dense = false;
    let mixed = false;
    let selectedId = null;
    let isolatedStyle = null;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      if (tag === "button") node.type = "button";
      return node;
    }

    function announce(message) {
      document.getElementById("feedback").textContent = message;
    }

    function tasksForPreview() {
      const tasks = titles.slice(0, dense ? 12 : 6).map((title, index) => ({ id: `task-${index}`, title, state: "pending" }));
      if (mixed) {
        tasks[0] = { id: "running", title: "优化任务加载速度", state: "running" };
        tasks[1] = { id: "question", title: "确认发布配置", state: "question" };
        tasks[2] = { id: "failed", title: "修复构建失败", state: "failed" };
        tasks.splice(3, 0, { id: "queued", title: "补齐接口文档", state: "queued" });
        tasks.push({ id: "accepted", title: "已验收的任务示例", state: "accepted" });
      }
      return tasks;
    }

    function dotSpecimen(zoomed) {
      const specimen = element("div", `specimen${zoomed ? " zoom" : ""}`);
      const stage = element("span", "sample-stage");
      stage.setAttribute("aria-hidden", "true");
      stage.append(element("span", "dot"));
      specimen.append(stage, element("span", "", zoomed ? "4× 放大" : "实际尺寸"));
      return specimen;
    }

    function renderCard(style, tasks) {
      const card = element("section", `card style-${style.key}`);
      card.dataset.style = style.key;
      card.hidden = isolatedStyle !== null && isolatedStyle !== style.key;
      card.setAttribute("aria-labelledby", `heading-${style.key}`);
      const header = element("div", "card-header");
      const heading = element("h2");
      heading.id = `heading-${style.key}`;
      heading.append(element("span", "number", style.number), document.createTextNode(style.name));
      const isolate = element("button", "isolate", isolatedStyle === style.key ? "回到对比" : "单独看");
      isolate.dataset.isolate = style.key;
      isolate.setAttribute("aria-label", `${isolatedStyle === style.key ? "返回全部对比" : "单独查看"}：${style.name}`);
      isolate.onclick = () => {
        isolatedStyle = isolatedStyle === style.key ? null : style.key;
        render();
        document.querySelector(`[data-isolate="${style.key}"]`)?.focus({ preventScroll: true });
      };
      header.append(heading, isolate);
      const specimens = element("div", "specimens");
      specimens.append(dotSpecimen(false), dotSpecimen(true));
      const list = element("div", "list");
      list.setAttribute("aria-label", `${style.name}任务列表`);
      for (const task of tasks) {
        const row = element("button", `row${selectedId === task.id ? " selected" : ""}`);
        row.dataset.taskId = task.id;
        row.setAttribute("aria-label", `${task.title}，${statusLabels[task.state]}`);
        row.setAttribute("aria-pressed", String(selectedId === task.id));
        const leading = element("span", "leading");
        leading.setAttribute("aria-hidden", "true");
        if (task.state === "pending") leading.append(element("span", "dot"));
        else if (task.state !== "accepted") leading.append(element("span", `signal ${task.state}`));
        row.append(leading, element("span", "task-title", task.title));
        if (mixed && task.state !== "pending") row.append(element("span", "status", statusLabels[task.state]));
        row.onclick = () => {
          selectedId = task.id;
          render();
          announce(`已查看「${task.title}」· ${statusLabels[task.state]}。${task.state === "pending" ? "六版的待验收圆点都保留，不会因为看过而消失。" : "此状态的圆点不参与本次样式更换。"}`);
        };
        list.append(row);
      }
      card.append(header, element("p", "description", style.description), specimens, list, element("div", "spec", style.spec));
      return card;
    }

    function render() {
      const active = document.activeElement;
      const activeStyle = active?.closest(".card")?.dataset.style;
      const activeTask = active?.dataset.taskId;
      const gallery = document.getElementById("gallery");
      gallery.classList.toggle("single", isolatedStyle !== null);
      const tasks = tasksForPreview();
      gallery.replaceChildren(...styles.map(style => renderCard(style, tasks)));
      if (activeStyle && activeTask) document.querySelector(`[data-style="${activeStyle}"] [data-task-id="${activeTask}"]`)?.focus({ preventScroll: true });
      document.getElementById("density").setAttribute("aria-pressed", String(dense));
      document.getElementById("density").textContent = dense ? "回到短列表" : "看更密的列表";
      document.getElementById("mixed").setAttribute("aria-pressed", String(mixed));
      document.getElementById("mixed").textContent = mixed ? "只看待验收" : "混合其他状态";
    }

    document.getElementById("density").onclick = () => {
      dense = !dense;
      if (!tasksForPreview().some(task => task.id === selectedId)) selectedId = null;
      render();
      announce(dense ? "已切换到密集列表：对比重复排列时的视觉重量。" : "已回到短列表。圆点大小、行高和标题样式不变。");
    };
    document.getElementById("mixed").onclick = () => {
      mixed = !mixed;
      selectedId = null;
      render();
      announce(mixed ? "混合状态已打开。运行、答复、失败、排队圆点保持相同；已验收不画点。" : "现在只看待验收：每颗圆点都表示未验收，与是否看过无关。");
    };
    document.getElementById("theme").onclick = () => {
      const dark = document.documentElement.classList.toggle("dark");
      document.getElementById("theme").setAttribute("aria-pressed", String(dark));
      document.getElementById("theme").textContent = dark ? "浅色" : "深色";
    };
    document.getElementById("all").onclick = () => { isolatedStyle = null; render(); };
    document.getElementById("clear").onclick = () => {
      selectedId = null;
      render();
      announce("已清除选中背景。待验收圆点仍然全部保留。");
    };
    render();
  </script>
</body>
</html>
